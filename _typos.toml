# Translations are not English; typos would flag native words (e.g. German "Alle").
[files]
extend-exclude = ["strings/*.rules", "!strings/en.rules", "docs/workshop/*.txt", "!docs/workshop/english.txt"]

[default.extend-words]
# Game API spelling: Thruster.UncomittedActivationLevel.
Uncomitted = "Uncomitted"
# .NET GC mode name (Dynamic Adaptation To Application Sizes).
DATAS = "DATAS"
